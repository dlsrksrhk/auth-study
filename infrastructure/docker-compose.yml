services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_study
      POSTGRES_USER: auth_study
      POSTGRES_PASSWORD: auth_study
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_study -d auth_study"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - auth-study-postgres:/var/lib/postgresql/data

  reference-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reference_app
      POSTGRES_USER: reference_app
      POSTGRES_PASSWORD: reference_app
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reference_app -d reference_app"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - reference-app-postgres:/var/lib/postgresql/data

volumes:
  auth-study-postgres:
  reference-app-postgres:
