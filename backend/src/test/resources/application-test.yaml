app:
  oauth:
    issuer: http://idp.localhost:8080
    authorization-code-ttl: 60s
    access-token-ttl: 5m
    id-token-ttl: 5m
    refresh-token-ttl: 7d
    session-idle-timeout: 30m
    session-absolute-timeout: 8h
    session-cookie-name: IDP_AUTH_SESSION
    user-info-audience: auth-study-userinfo
    # Test-only key, intentionally different from the committed local development key.
    signing-key-wrapping-key-id: local-test-oauth-wrap-v1
    signing-key-wrapping-key-base64: cnmmvUQ2YI7i4s03NWkvSOT0fmFKLvT2FWQCas9LMr8=
  security:
    jwt:
      secret: wX9uFnX9dXni4q5HKQv7oiVQak9aTUGq6xov2mT2Dk8=
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    refresh-cookie:
      name: AUTH_STUDY_REFRESH
      path: /api/v1/auth
      http-only: true
      secure: false
      same-site: Lax
    browser-origin: http://localhost:3000
    login-lock:
      max-failures: 5
      lock-duration: PT15M
    bootstrap-admin:
      email: admin@auth-study.local
      password: AuthStudy1234!
      must-change-password: false
