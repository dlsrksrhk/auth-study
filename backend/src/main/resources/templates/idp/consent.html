<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>접근 권한 동의</title>
    <link rel="stylesheet" href="/idp/idp.css">
</head>
<body>
<main class="card card-wide" aria-labelledby="page-title">
    <p class="eyebrow">권한 요청</p>
    <h1 id="page-title"><span th:text="${clientDisplayName}">애플리케이션</span> 접근 권한 동의</h1>
    <section aria-labelledby="all-scopes-title">
        <h2 id="all-scopes-title">모든 요청 권한</h2>
        <ul class="scope-list">
            <li th:each="scope : ${requestedScopes}">
                <strong th:text="${scope.description}">권한 설명</strong>
                <code th:text="${scope.scope}">scope</code>
                <span class="badge" th:if="${scope.newlyRequested}">새로 요청됨</span>
            </li>
        </ul>
    </section>
    <section th:if="${!newScopes.isEmpty()}" aria-labelledby="new-scopes-title">
        <h2 id="new-scopes-title">새로 요청된 권한</h2>
        <ul class="scope-list compact">
            <li th:each="scope : ${newScopes}" th:text="${scope.description}">새 권한</li>
        </ul>
    </section>
    <div class="actions">
        <form method="post" action="/oauth2/authorize">
            <input type="hidden" name="client_id" th:value="${clientId}">
            <input type="hidden" name="state" th:value="${state}">
            <input type="hidden" name="scope" th:each="scope : ${requestedScopes}" th:value="${scope.scope}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">동의하고 계속</button>
        </form>
        <form method="post" th:action="@{/idp/consent/deny}">
            <input type="hidden" name="client_id" th:value="${clientId}">
            <input type="hidden" name="state" th:value="${state}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="secondary" type="submit">거부</button>
        </form>
    </div>
</main>
</body>
</html>
