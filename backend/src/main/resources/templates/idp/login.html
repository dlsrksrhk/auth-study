<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <link rel="stylesheet" href="/idp/idp.css">
</head>
<body>
<main class="card" aria-labelledby="page-title">
    <p class="eyebrow">Auth Study IdP</p>
    <h1 id="page-title">로그인</h1>
    <p>계속하려면 회사 계정으로 로그인해 주세요.</p>
    <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
    <form method="post" th:action="@{/idp/login}">
        <input type="hidden" name="flowId" th:value="${flowId}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
    </form>
</main>
</body>
</html>
