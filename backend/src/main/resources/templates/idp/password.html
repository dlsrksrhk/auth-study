<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 변경</title>
    <link rel="stylesheet" href="/idp/idp.css">
</head>
<body>
<main class="card" aria-labelledby="page-title">
    <p class="eyebrow">보안 확인</p>
    <h1 id="page-title">비밀번호 변경</h1>
    <p>서비스 이용 전 임시 비밀번호를 변경해야 합니다.</p>
    <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
    <form method="post" th:action="@{/idp/password}">
        <input type="hidden" name="flowId" th:value="${flowId}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="current-password">현재 비밀번호</label>
        <input id="current-password" name="currentPassword" type="password"
               autocomplete="current-password" required>
        <label for="new-password">새 비밀번호</label>
        <input id="new-password" name="newPassword" type="password"
               autocomplete="new-password" minlength="12" maxlength="64"
               aria-describedby="password-help" required>
        <p id="password-help" class="help">영문 대문자·소문자·숫자·특수문자를 포함해 12~64자로 입력해 주세요.</p>
        <button type="submit">비밀번호 변경</button>
    </form>
</main>
</body>
</html>
