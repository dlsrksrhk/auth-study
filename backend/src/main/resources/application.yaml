spring:
  application:
    name: auth-study
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      cookie:
        name: ${app.oauth.session-cookie-name}
        http-only: true
        secure: ${app.oauth.session-cookie-secure:true}
        same-site: lax
