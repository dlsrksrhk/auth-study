spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_study
    username: auth_study
    password: auth_study

app:
  dev:
    sample-data:
      enabled: ${DEV_SAMPLE_DATA_ENABLED:false}
  oauth:
    issuer: http://idp.localhost:8080
    authorization-code-ttl: 60s
    access-token-ttl: 5m
    id-token-ttl: 5m
    refresh-token-ttl: 7d
    session-idle-timeout: 30m
    session-absolute-timeout: 8h
    session-cookie-name: IDP_AUTH_SESSION
    session-cookie-secure: false
    user-info-audience: auth-study-userinfo
    # LOCAL-ONLY wrapping material. Never reuse this key outside the learning profile.
    signing-key-wrapping-key-id: local-dev-oauth-wrap-v1
    signing-key-wrapping-key-base64: PYFkQN/x1n7sZ8wKp9HXRZRTT8D2ljbxMikQqFAONhg=
  security:
    jwt:
      secret: wX9uFnX9dXni4q5HKQv7oiVQak9aTUGq6xov2mT2Dk8=
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    refresh-cookie:
      name: AUTH_STUDY_REFRESH
      path: /api/v1/auth
      http-only: true
      secure: false
      same-site: Lax
    browser-origin: http://localhost:3000
    login-lock:
      max-failures: 5
      lock-duration: PT15M
    bootstrap-admin:
      email: admin@auth-study.local
      password: AuthStudy1234!
      must-change-password: false
